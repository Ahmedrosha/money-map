<script>
// One link for everyone: phones go straight to their store.
// Ad links carry utm_source / utm_campaign: the visit is counted (no IP,
// no device id), and on Android the campaign rides along to the app.
var PLAY = "https://play.google.com/store/apps/details?id=com.rashad.moneytracker";
var APPSTORE = "https://apps.apple.com/app/id6817193952";
var ua = navigator.userAgent || "";
var q = new URLSearchParams(location.search);
var src = q.get("utm_source") || "", camp = q.get("utm_campaign") || "";
var plat = /android/i.test(ua) ? "android" : (/iphone|ipad|ipod/i.test(ua) ? "iphone" : "other");
function go() {
  if (go.done) return;
  go.done = true;
  if (plat === "android") { location.replace(PLAY); }
  else if (plat === "iphone" && APPSTORE) { location.replace(APPSTORE); }
}
if (camp) {
  PLAY += "&referrer=" + encodeURIComponent("utm_source=" + src + "&utm_campaign=" + camp);
  // Wait for the count (at most 1.5 s) before leaving: iPhone Safari drops
  // it when the page jumps to the App Store at once.
  try {
    fetch("https://moneymap-verify.tamdeenprop.workers.dev/hit", {
      method: "POST", mode: "no-cors", keepalive: true,
      body: JSON.stringify({ source: src, campaign: camp, platform: plat })
    }).then(go, go);
  } catch (e) { go(); }
  setTimeout(go, 1500);
} else {
  go();
}
document.addEventListener("DOMContentLoaded", function () {
  var a = document.querySelector("[data-play]");
  if (a) a.href = PLAY;
});
</script>
